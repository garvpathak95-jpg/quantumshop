name: QuantumShop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Product Service
        run: docker build -t quantumshop-product ./product-service

      - name: Build Cart Service
        run: docker build -t quantumshop-cart ./cart-service

      - name: Build Auth Service
        run: docker build -t quantumshop-auth ./auth-service

      - name: Build Payment Service
        run: docker build -t quantumshop-payment ./payment-service

      - name: Build Frontend Image
        run: docker build -t quantumshop-frontend ./frontend

      - name: Scan Product Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quantumshop-product
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan Cart Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quantumshop-cart
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan Auth Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quantumshop-auth
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan Payment Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quantumshop-payment
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quantumshop-frontend
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image owner
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Tag Docker Images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag quantumshop-product ghcr.io/${IMAGE_OWNER}/quantumshop-product:${{ github.sha }}
          docker tag quantumshop-product ghcr.io/${IMAGE_OWNER}/quantumshop-product:latest

          docker tag quantumshop-cart ghcr.io/${IMAGE_OWNER}/quantumshop-cart:${{ github.sha }}
          docker tag quantumshop-cart ghcr.io/${IMAGE_OWNER}/quantumshop-cart:latest

          docker tag quantumshop-auth ghcr.io/${IMAGE_OWNER}/quantumshop-auth:${{ github.sha }}
          docker tag quantumshop-auth ghcr.io/${IMAGE_OWNER}/quantumshop-auth:latest

          docker tag quantumshop-payment ghcr.io/${IMAGE_OWNER}/quantumshop-payment:${{ github.sha }}
          docker tag quantumshop-payment ghcr.io/${IMAGE_OWNER}/quantumshop-payment:latest

          docker tag quantumshop-frontend ghcr.io/${IMAGE_OWNER}/quantumshop-frontend:${{ github.sha }}
          docker tag quantumshop-frontend ghcr.io/${IMAGE_OWNER}/quantumshop-frontend:latest

      - name: Push Product Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${IMAGE_OWNER}/quantumshop-product:${{ github.sha }}
          docker push ghcr.io/${IMAGE_OWNER}/quantumshop-product:latest

      - name: Push Cart Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${IMAGE_OWNER}/quantumshop-cart:${{ github.sha }}
          docker push ghcr.io/${IMAGE_OWNER}/quantumshop-cart:latest

      - name: Push Auth Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${IMAGE_OWNER}/quantumshop-auth:${{ github.sha }}
          docker push ghcr.io/${IMAGE_OWNER}/quantumshop-auth:latest

      - name: Push Payment Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${IMAGE_OWNER}/quantumshop-payment:${{ github.sha }}
          docker push ghcr.io/${IMAGE_OWNER}/quantumshop-payment:latest

      - name: Push Frontend Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${IMAGE_OWNER}/quantumshop-frontend:${{ github.sha }}
          docker push ghcr.io/${IMAGE_OWNER}/quantumshop-frontend:latest
