name: QuantumShop CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Product Service
        run: docker build -t quantumshop-product ./product-service

      - name: Build Cart Service
        run: docker build -t quantumshop-cart ./cart-service

      - name: Build Auth Service
        run: docker build -t quantumshop-auth ./auth-service

      - name: Build Payment Service
        run: docker build -t quantumshop-payment ./payment-service

      - name: Build Frontend Image
        run: docker build -t quantumshop-frontend ./frontend
